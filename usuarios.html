<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Usuarios - Abalifer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eaeded;
}

header{

background:#131921;
color:white;

padding:20px;

}

.container{

max-width:1400px;

margin:20px auto;

padding:20px;

}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;

margin-bottom:20px;

}

.card{

background:white;

padding:20px;

border-radius:10px;

text-align:center;

box-shadow:
0 2px 8px rgba(0,0,0,.1);

}

.numero{

font-size:35px;

font-weight:bold;

color:#00c853;

margin-top:10px;

}

.search{

background:white;

padding:20px;

border-radius:10px;

margin-bottom:20px;

}

.search input{

width:100%;

padding:12px;

border:1px solid #ccc;

border-radius:5px;

}

.table-container{

background:white;

padding:20px;

border-radius:10px;

overflow:auto;

}

table{

width:100%;

border-collapse:collapse;

}

th,td{

padding:12px;

border-bottom:
1px solid #ddd;

text-align:left;

}

th{

background:#f5f5f5;

}

button{

padding:10px 15px;

border:none;

border-radius:5px;

cursor:pointer;

}

.delete{

background:red;

color:white;

}

</style>

</head>
<body>

<header>

<h1>
👥 Gestión de Usuarios
</h1>

<a href="../menu/menu.html">
  ← Back To Menu
</a>

</header>

<div class="container">

<div class="cards">

<div class="card">

<h3>
Usuarios Registrados
</h3>

<div
class="numero"
id="totalUsuarios">

0

</div>

</div>

<div class="card">

<h3>
Pedidos Totales
</h3>

<div
class="numero"
id="totalPedidos">

0

</div>

</div>

</div>

<div class="search">

<input
type="text"
id="buscar"
placeholder="Buscar usuario por nombre o correo">

</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>Nombre</th>
<th>Correo</th>
<th>Pedidos</th>
<th>Total Gastado</th>
<th>Acciones</th>

</tr>

</thead>

<tbody id="usuariosTabla">

</tbody>

</table>

</div>

</div>

<script>

let usuarios =
JSON.parse(
localStorage.getItem(
"usuarios"
)
) || [];

const pedidos =
JSON.parse(
localStorage.getItem(
"pedidos"
)
) || [];

const tabla =
document.getElementById(
"usuariosTabla"
);

document
.getElementById(
"totalUsuarios"
)
.textContent =
usuarios.length;

document
.getElementById(
"totalPedidos"
)
.textContent =
pedidos.length;

function renderizar(lista){

tabla.innerHTML = "";

if(lista.length === 0){

tabla.innerHTML = `

<tr>

<td colspan="5">

No se encontraron usuarios

</td>

</tr>

`;

return;

}

lista.forEach(
(usuario,index)=>{

const pedidosUsuario =
pedidos.filter(

pedido =>
pedido.email ===
usuario.email

);

let totalGastado = 0;

pedidosUsuario.forEach(
pedido=>{

totalGastado +=
pedido.total;

}
);

tabla.innerHTML += `

<tr>

<td>

${usuario.nombre}

</td>

<td>

${usuario.email}

</td>

<td>

${pedidosUsuario.length}

</td>

<td>

$${totalGastado.toFixed(2)}

</td>

<td>

<button
class="delete"
onclick="
eliminarUsuario(
${index}
)
">

Eliminar

</button>

</td>

</tr>

`;

});

}

function eliminarUsuario(index){

if(
confirm(
"¿Eliminar usuario?"
)
){

usuarios.splice(
index,
1
);

localStorage.setItem(
"usuarios",
JSON.stringify(
usuarios
)
);

renderizar(
usuarios
);

document
.getElementById(
"totalUsuarios"
)
.textContent =
usuarios.length;

}

}

document
.getElementById(
"buscar"
)
.addEventListener(
"input",
e=>{

const texto =
e.target.value
.toLowerCase();

const filtrados =
usuarios.filter(
usuario=>

usuario.nombre
.toLowerCase()
.includes(texto)

||

usuario.email
.toLowerCase()
.includes(texto)

);

renderizar(
filtrados
);

}
);

renderizar(
usuarios
);

</script>

</body>
</html>
