<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Reportes - Abalifer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eaeded;
}

header{

background:#131921;
color:white;

padding:20px;

}

.container{

max-width:1400px;

margin:20px auto;

padding:20px;

}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;

margin-bottom:20px;

}

.card{

background:white;

padding:20px;

border-radius:10px;

text-align:center;

box-shadow:
0 2px 8px rgba(0,0,0,.1);

}

.numero{

font-size:35px;

font-weight:bold;

color:#00c853;

margin-top:10px;

}

.section{

background:white;

padding:20px;

border-radius:10px;

margin-bottom:20px;

}

table{

width:100%;

border-collapse:collapse;

margin-top:15px;

}

th,td{

padding:12px;

border-bottom:
1px solid #ddd;

text-align:left;

}

th{

background:#f5f5f5;

}

.rojo{

color:red;
font-weight:bold;

}

.naranja{

color:#ff9800;
font-weight:bold;

}

.verde{

color:#00c853;
font-weight:bold;

}

</style>

</head>
<body>

<header>

<h1>
📈 Reportes de Ventas
</h1>

<a href="../menu/menu.html">
  ← Back To Menu
</a>

</header>

<div class="container">

<div class="cards">

<div class="card">

<h3>
💰 Ventas Totales
</h3>

<div
class="numero"
id="ventasTotales">

0

</div>

</div>

<div class="card">

<h3>
📦 Pedidos
</h3>

<div
class="numero"
id="totalPedidos">

0

</div>

</div>

<div class="card">

<h3>
👥 Usuarios
</h3>

<div
class="numero"
id="totalUsuarios">

0

</div>

</div>

<div class="card">

<h3>
🏆 Producto Top
</h3>

<div
class="numero"
id="productoTop">

-

</div>

</div>

</div>

<div class="section">

<h2>
📊 Inventario
</h2>

<table>

<thead>

<tr>

<th>Producto</th>
<th>Stock</th>
<th>Vendidos</th>
<th>Estado</th>

</tr>

</thead>

<tbody id="inventario">

</tbody>

</table>

</div>

<div class="section">

<h2>
💵 Ingresos por Producto
</h2>

<table>

<thead>

<tr>

<th>Producto</th>
<th>Precio</th>
<th>Vendidos</th>
<th>Ingresos</th>

</tr>

</thead>

<tbody id="ingresos">

</tbody>

</table>

</div>

</div>

<script>

const pedidos =
JSON.parse(
localStorage.getItem(
"pedidos"
)
) || [];

const usuarios =
JSON.parse(
localStorage.getItem(
"usuarios"
)
) || [];

const productos =
JSON.parse(
localStorage.getItem(
"productos"
)
) || [];

let ventas = 0;

pedidos.forEach(
pedido => {

ventas += pedido.total;

}
);

document
.getElementById(
"ventasTotales"
)
.textContent =
"$" +
ventas.toFixed(2);

document
.getElementById(
"totalPedidos"
)
.textContent =
pedidos.length;

document
.getElementById(
"totalUsuarios"
)
.textContent =
usuarios.length;

let topProducto =
"Sin ventas";

if(productos.length > 0){

const ordenados =
[...productos].sort(
(a,b)=>
(b.vendidos || 0)
-
(a.vendidos || 0)
);

topProducto =
ordenados[0].nombre;

}

document
.getElementById(
"productoTop"
)
.textContent =
topProducto;

const inventario =
document.getElementById(
"inventario"
);

productos.forEach(
producto => {

let estado = "";

if(producto.stock === 0){

estado =
'<span class="rojo">Agotado</span>';

}
else if(producto.stock <= 5){

estado =
'<span class="naranja">Stock Bajo</span>';

}
else{

estado =
'<span class="verde">Disponible</span>';

}

inventario.innerHTML += `

<tr>

<td>
${producto.nombre}
</td>

<td>
${producto.stock}
</td>

<td>
${producto.vendidos || 0}
</td>

<td>
${estado}
</td>

</tr>

`;

}
);

const ingresos =
document.getElementById(
"ingresos"
);

productos.forEach(
producto => {

const vendidos =
producto.vendidos || 0;

const ingreso =
producto.precio *
vendidos;

ingresos.innerHTML += `

<tr>

<td>
${producto.nombre}
</td>

<td>
$${producto.precio}
</td>

<td>
${vendidos}
</td>

<td>
$${ingreso.toFixed(2)}
</td>

</tr>

`;

}
);

</script>

</body>
</html>
