<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/admin.css">
<title>Panel Admin - Abalifer</title>
</head>


<body>

<header>

<h1>
Panel Administrativo
</h1>

<a href="menu/menu.html">
  ← Back To Menu
</a>

</header>

<div class="container">

<div class="formulario">

<h2>
Agregar Producto
</h2>

<input
type="text"
id="nombre"
placeholder="Nombre">

<input
type="number"
id="precio"
placeholder="Precio">

<input
type="text"
id="imagenes"
placeholder="URLs separadas por coma">

<input
type="text"
id="categoria"
placeholder="Categoría">

<input
type="number"
id="stock"
placeholder="Stock">

<input
type="number"
step="0.1"
id="rating"
placeholder="Valoración">

<input
type="number"
id="oferta"
placeholder="Oferta %">

<button
class="guardar"
onclick="guardarProducto()">
Guardar Producto
</button>

</div>

<div
id="productos"
class="productos">
</div>

</div>


<div id="modalEliminar" class="modal">

  <div class="modal-contenido">

    <h2>🗑 Eliminar Producto</h2>

    <p>
      ¿Seguro que deseas eliminar este producto?
    </p>

    <div class="acciones">

      <button
      class="cancelar"
      onclick="cerrarModal()">
      Cancelar
      </button>

      <button
      class="confirmar"
      onclick="confirmarEliminar()">
      Eliminar
      </button>

    </div>

  </div>

</div>
</body>
<script src="js/admin.js"></script>
</html>
