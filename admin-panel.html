<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/admin-panel.css">
<title>Dashboard Admin</title>

</head>
<body>

<header>

<h1>
📊 Dashboard Administrativo
</h1>

<a href="menu/menu.html">
  ← Back To Menu
</a>

</header>

<div class="container">

<div class="cards">

<div class="card">

<h3>
Ventas Totales
</h3>

<div
id="ventas"
class="numero">

0

</div>

</div>

<div class="card">

<h3>
Pedidos
</h3>

<div
id="pedidos"
class="numero">

0

</div>

</div>

<div class="card">

<h3>
Usuarios
</h3>

<div
id="usuarios"
class="numero">

0

</div>

</div>

<div class="card">

<h3>
Productos
</h3>

<div
id="productos"
class="numero">

0

</div>

</div>

</div>

<div class="section">

<h2>
🏆 Productos Más Vendidos
</h2>

<table>

<thead>

<tr>

<th>
Producto
</th>

<th>
Vendidos
</th>

<th>
Stock
</th>

</tr>

</thead>

<tbody
id="ranking">
</tbody>

</table>

</div>

<div class="section">

<h2>
📦 Últimos Pedidos
</h2>

<table>

<thead>

<tr>

<th>
Cliente
</th>

<th>
Fecha
</th>

<th>
Total
</th>

<th>
Pago
</th>

</tr>

</thead>

<tbody
id="ultimosPedidos">
</tbody>

</table>

</div>

</div>
<script src="js/admin-panel.js"></script>
</body>
</html>
