<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Favoritos - Abalifer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eaeded;
}

header{

background:#131921;
color:white;

padding:20px;

display:flex;
justify-content:space-between;
align-items:center;

}

header a{

color:white;
text-decoration:none;

}

.container{

max-width:1400px;

margin:20px auto;

padding:20px;

}

.grid{

display:grid;

grid-template-columns:
repeat(
auto-fill,
minmax(250px,1fr)
);

gap:20px;

}

.card{

background:white;

border-radius:10px;

overflow:hidden;

box-shadow:
0 2px 10px rgba(0,0,0,.1);

}

.card img{

width:100%;
height:220px;

object-fit:cover;

}

.info{

padding:15px;

}

.precio{

font-size:22px;

font-weight:bold;

color:#B12704;

margin:10px 0;

}

button{

width:100%;

padding:12px;

border:none;

border-radius:20px;

cursor:pointer;

margin-top:8px;

}

.agregar{

background:#ffd814;

}

.agregar:hover{

background:#f7ca00;

}

.eliminar{

background:red;
color:white;

}

.empty{

background:white;

padding:50px;

text-align:center;

border-radius:10px;

}

</style>

</head>
<body>

<header>

<h1>
❤️ Mis Favoritos
</h1>

<a href="index.html">

← Volver a la tienda

</a>

</header>

<div class="container">

<div
id="favoritosContainer"
class="grid">

</div>

</div>

<script>

const favoritos =
JSON.parse(
localStorage.getItem(
"favoritos"
)
) || [];

const productos =
JSON.parse(
localStorage.getItem(
"productos"
)
) || [];

const carrito =
JSON.parse(
localStorage.getItem(
"carrito"
)
) || [];

const contenedor =
document.getElementById(
"favoritosContainer"
);

function renderizar(){

const favoritosProductos =
productos.filter(

producto =>

favoritos.includes(producto.nombre)

);

if(favoritosProductos.length === 0 ){
contenedor.innerHTML = `

<div class="empty">

<h2>
No tienes favoritos
</h2>

<p>
Agrega productos desde la tienda.
</p>

</div>`;

return;
}

contenedor.innerHTML = "";

favoritosProductos.forEach(
producto=>{

contenedor.innerHTML += `

<div class="card">

<img
src="${producto.imagenes}">

<div class="info">

<h3>
${producto.nombre}
</h3>

<div class="precio">

$${producto.precio}

</div>

<p>

Stock:
${producto.stock}

</p>

<p>

⭐ ${producto.rating || 0}

</p>

<button
class="agregar"
onclick="
agregarCarrito(
'${producto.nombre}',
${producto.precio}
)
">

Agregar al carrito

</button>

<button
class="eliminar"
onclick="
eliminarFavorito(
'${producto.nombre}'
)
">

Eliminar Favorito

</button>

</div>

</div>

`;

});

}

function agregarCarrito(
nombre,
precio
){

const item =
carrito.find(

p =>
p.nombre === nombre

);

if(item){

item.cantidad++;

}else{

carrito.push({

nombre,
precio,
cantidad:1

});

}

localStorage.setItem(
"carrito",
JSON.stringify(carrito)
);

alert(
"Producto agregado al carrito"
);

}

function eliminarFavorito(
nombre
){

const nuevosFavoritos =
favoritos.filter(

f => f !== nombre

);

localStorage.setItem(
"favoritos",
JSON.stringify(
nuevosFavoritos
)
);

location.reload();

}

renderizar();

</script>

</body>
</html>
